# ===== 关键词过滤 =====
filter:
  method: "keyword"
  keyword_file: "frequency_words.txt"
  base_keywords:
    # ── 精准复合词（高置信度，直接命中）──
    - "外卖骑手"
    - "外卖小哥"
    - "配送员"
    - "骑手权益"
    - "骑手收入"
    - "骑手政策"
    - "骑手社保"
    - "骑手事故"
    - "骑手关爱"
    - "骑手驿站"
    - "美团骑手"
    - "饿了么骑手"
    - "即时配送 骑手"
    - "新就业形态 骑手"
    - "平台用工 骑手"
    - "灵活就业 骑手"
    # ── 单独关键词（覆盖综合媒体，配合 frequency_words.txt 二次过滤）──
    # 注意：这些词较宽泛，依赖 frequency_words.txt 的子分类规则做精细过滤
    - "骑手"
    - "即时配送"
    - "新就业形态"
    - "平台用工"
    - "职业伤害保障"

# ===== 报告模式 =====
report:
  mode: "daily"
  group_by: "category"
  max_news_per_keyword: 20
  dedup:
    enabled: true
    method: "title_similarity"
    threshold: 0.85
    keep: "highest_priority"

# ===== 存储路径 =====
storage:
  output_dir: "output"
  news_dir: "output/news"
  hot_dir: "output/hot"
  report_dir: "output/reports"

notification:
  enable_notification: false

ai:
  enable_ai_analysis: false
