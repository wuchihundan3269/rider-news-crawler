# ===== 关键词过滤 =====
# 策略：所有关键词必须是"外卖/配送/平台"相关的复合词
# 严禁单独使用"骑手"——会命中摩托车骑手、自行车骑手、骑马等无关内容
filter:
  method: "keyword"
  keyword_file: "frequency_words.txt"
  base_keywords:
    # ── 外卖骑手核心词（最高置信度）──
    - "外卖骑手"
    - "外卖小哥"
    - "外卖配送员"
    - "配送骑手"
    - "配送小哥"
    - "送餐骑手"
    - "送外卖"
    # ── 平台+骑手复合词 ──
    - "美团骑手"
    - "饿了么骑手"
    - "京东骑手"
    - "顺丰骑手"
    - "闪送骑手"
    - "达达骑手"
    # ── 骑手+属性复合词（必须同时含"骑手"和属性词）──
    - "骑手权益"
    - "骑手收入"
    - "骑手政策"
    - "骑手社保"
    - "骑手事故"
    - "骑手关爱"
    - "骑手驿站"
    - "骑手福利"
    - "骑手健康"
    - "骑手安全"
    - "骑手保障"
    - "骑手维权"
    - "骑手故事"
    - "骑手正能量"
    # ── 行业复合词 ──
    - "即时配送 骑手"
    - "新就业形态 骑手"
    - "平台用工 骑手"
    - "灵活就业 骑手"
    - "职业伤害保障 骑手"
    - "外卖行业 骑手"

# ===== 报告模式 =====
report:
  mode: "daily"
  group_by: "category"
  max_news_per_keyword: 20
  dedup:
    enabled: true
    method: "title_similarity"
    threshold: 0.85
    keep: "highest_priority"

# ===== 存储路径 =====
storage:
  output_dir: "output"
  news_dir: "output/news"
  hot_dir: "output/hot"
  report_dir: "output/reports"

notification:
  enable_notification: false

ai:
  enable_ai_analysis: false
