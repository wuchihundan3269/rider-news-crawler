# ===== 关键词过滤（引用 frequency_words.txt）=====
filter:
  method: "keyword"
  keyword_file: "frequency_words.txt"
  # 全局必须命中的基础词（任意一个即可）
  base_keywords:
    - "骑手"
    - "外卖"
    - "配送员"
    - "送餐"
    - "即时配送"
    - "新就业形态"
    - "平台用工"
    - "灵活就业"

# ===== 报告模式 =====
report:
  mode: "daily"
  group_by: "category"
  max_news_per_keyword: 20    # 每小时更新，每个关键词最多保留20条
  # 去重配置
  dedup:
    enabled: true
    method: "title_similarity"   # 标题相似度去重
    threshold: 0.85              # 相似度阈值
    keep: "highest_priority"     # 保留最高优先级来源

# ===== 存储路径 =====
storage:
  output_dir: "output"
  news_dir: "output/news"
  hot_dir: "output/hot"
  report_dir: "output/reports"

notification:
  enable_notification: false

ai:
  enable_ai_analysis: false
