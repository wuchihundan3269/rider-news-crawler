# ===== 关键词过滤 =====
filter:
  method: "keyword"
  keyword_file: "frequency_words.txt"
  base_keywords:
    - "骑手"
    - "外卖"
    - "配送员"
    - "送餐"
    - "即时配送"
    - "新就业形态"
    - "平台用工"
    - "灵活就业"
    - "美团"
    - "饿了么"
    - "闪送"
    - "顺丰同城"

# ===== 报告模式 =====
report:
  mode: "daily"
  group_by: "category"
  max_news_per_keyword: 20
  dedup:
    enabled: true
    method: "title_similarity"
    threshold: 0.85
    keep: "highest_priority"

# ===== 存储路径 =====
storage:
  output_dir: "output"
  news_dir: "output/news"
  hot_dir: "output/hot"
  report_dir: "output/reports"

notification:
  enable_notification: false

ai:
  enable_ai_analysis: false
