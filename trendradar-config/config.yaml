# 【精准搜索型 RSS 说明】
#   百度新闻 RSS：http://news.baidu.com/ns?word=关键词&tn=rss&cl=2
#     - 直接搜索关键词，命中率极高
#     - cl=2 全文搜索；cl=1 仅标题搜索
#     - 条目 link 指向 news.baidu.com 聚合页（可正常访问）
#   今日头条 RSS（RSSHub）：https://rsshub.app/toutiao/search/关键词
#     - 搜索结果直接命中，无需二次过滤
#   微博搜索 RSS（RSSHub）：https://rsshub.app/weibo/search/keyword/关键词
