# ===== 骑手行业新闻监控 · TrendRadar 配置 =====
# 数据来源方案：精准关键词搜索型 RSS（替代综合媒体全量 feed 过滤）
# 核心策略：直接用"外卖骑手"等精准词搜索，而非从全量 feed 里过滤
# 三管道：热榜平台 / RSS订阅 / 搜索引擎关键词
# 六分类：骑手故事(rider_story) / 骑手关怀(care) / 行业政策(policy) / 宏观报告(report) / 平台动作(platform) / 舆论信息(opinion)
# 媒体优先级：P0（权威官媒）→ P5（自媒体/论坛）
# 去重规则：同一事件只保留最高优先级来源
# 排序规则：时效优先，同一天内按 P0→P5 降序

base:
  timezone: "Asia/Shanghai"
  language: "zh"

# ===== 媒体优先级体系（P0-P5）=====
media_priority:
  dedup_strategy: "keep_highest_priority"
  sort_strategy: "recency_first_then_priority"
  p0:
    - "新华社"
    - "人民日报"
    - "央视"
    - "CCTV"
    - "国务院"
    - "人社部"
    - "市场监管总局"
    - "交通运输部"
  p1:
    - "财新"
    - "澎湃新闻"
    - "第一财经"
    - "南方都市报"
    - "经济观察报"
    - "工人日报"
    - "中国青年报"
  p2:
    - "36氪"
    - "虎嗅"
    - "晚点LatePost"
    - "界面新闻"
    - "钛媒体"
    - "极客公园"
    - "Tech星球"
  p3:
    - "外卖行业报"
    - "物流时代"
    - "劳工报道"
    - "骑手之家"
    - "即时配送"
  p4:
    - "美团官方"
    - "饿了么官方"
    - "顺丰同城官方"
    - "达达官方"
    - "闪送官方"
  p5:
    - "微博"
    - "知乎"
    - "抖音"
    - "微信公众号"
    - "今日头条"

# ===== 管道一：热榜平台 =====
crawler:
  enable_crawler: true
  platforms:
    - weibo
    - zhihu
    - baidu
    - toutiao
    - douyin
  request_timeout: 30
  max_retries: 3
  hot_filter_keywords:
    - "外卖骑手"
    - "骑手"
    - "外卖"
    - "配送"
    - "美团"
    - "饿了么"
    - "即时配送"
    - "新就业形态"

# ===== 管道二：RSS 订阅（核心数据源）=====
# 核心策略：Google News 精准关键词搜索（境外服务器稳定可用）+ 官方 RSS 补充
# ─────────────────────────────────────────────────────────────
# 【数据源可用性（2026-06 实测）】
#   Google News RSS：全部可用，每个关键词最多100条，境外服务器直连
#   36kr 官方 feed：可用，30条
#   新浪新闻-社会：可用，15条
#   中国新闻网-社会：可用，30条
#   rsshub.app：境外服务器 403/超时，已移除
#   百度新闻 RSS：境外 301 重定向失败，已移除
#   新华网/人民网/澎湃官方 RSS：境外 307/0 失败，已移除
# ─────────────────────────────────────────────────────────────
rss:
  enable_rss: true
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds:

    # ══════════════════════════════════════════════════════════════
    # 【P2 主力】Google News 中文精准关键词搜索 RSS
    # GitHub Actions 境外服务器直连，每个关键词最多100条，最稳定
    # ══════════════════════════════════════════════════════════════

    - id: "gnews_waimai_rider"
      name: "Google新闻-外卖骑手"
      url: "https://news.google.com/rss/search?q=%E5%A4%96%E5%8D%96%E9%AA%91%E6%89%8B&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
      priority: "P2"
      category: "auto"
      tag: "auto"

    - id: "gnews_meituan_rider"
