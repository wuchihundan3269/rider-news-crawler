# ===== 骑手行业新闻监控 · TrendRadar 配置 =====
# 数据来源方案：学城文档 2763869388
# 三管道：热榜平台 / RSS订阅 / 搜索引擎关键词
# 四分类：骑手新闻(rider) / 行业动态(industry) / 平台动作(platform) / 舆情信息(opinion)
# 媒体优先级：P0（权威官媒）→ P5（自媒体/论坛）
# 去重规则：同一事件只保留最高优先级来源
# 排序规则：时效优先，同一天内按 P0→P5 降序
# 子分类 tag 由 scripts/transform.py 在转换阶段根据关键词匹配写入
# ⚠️ 搜索引擎 RSS 说明：
#   - Bing News RSS 在 GitHub Actions 环境返回 302，不可用
#   - 百度新闻 RSS 已 301 跳转，不可用
#   - Google News RSS 稳定返回 100 条/关键词，为主力来源

base:
  timezone: "Asia/Shanghai"
  language: "zh"

# ===== 媒体优先级体系（P0-P5）=====
media_priority:
  dedup_strategy: "keep_highest_priority"
  sort_strategy: "recency_first_then_priority"
  p0:
    - "新华社"
    - "人民日报"
    - "央视"
    - "CCTV"
    - "国务院"
    - "人社部"
    - "市场监管总局"
    - "交通运输部"
  p1:
    - "财新"
    - "澎湃新闻"
    - "第一财经"
    - "南方都市报"
    - "经济观察报"
    - "工人日报"
    - "中国青年报"
  p2:
    - "36氪"
    - "虎嗅"
    - "晚点LatePost"
    - "界面新闻"
    - "钛媒体"
    - "极客公园"
    - "Tech星球"
  p3:
    - "外卖行业报"
    - "物流时代"
    - "劳工报道"
    - "骑手之家"
    - "即时配送"
  p4:
    - "美团官方"
    - "饿了么官方"
    - "顺丰同城官方"
    - "达达官方"
    - "闪送官方"
  p5:
    - "微博"
    - "知乎"
    - "抖音"
    - "微信公众号"
    - "今日头条"

# ===== 管道一：热榜平台 =====
crawler:
  enable_crawler: true
  platforms:
    - weibo
    - zhihu
    - baidu
    - toutiao
    - douyin
  request_timeout: 30
  max_retries: 3
  hot_filter_keywords:
    - "骑手"
    - "外卖"
    - "配送"
    - "美团"
    - "饿了么"
    - "即时配送"
    - "新就业形态"

# ===== 管道二：RSS 订阅（核心数据源）=====
