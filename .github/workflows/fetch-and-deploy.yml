name: 抓取新闻 & 部署 GitHub Pages

# 数据来源方案：学城文档 2763869388
# 三管道：RSS订阅(P0-P5媒体) / 搜索引擎关键词 / 热榜平台
# 六分类：骑手新闻(rider_story) / 骑手关怀(care) / 行业观察(policy) / 宏观报告(report) / 平台动作(platform) / 舆论信息(opinion)
# RSS源：32个 Google News 精准关键词 + 3个官方 RSS（36氪/新浪/中国新闻网）
# 去重：同一事件保留最高优先级来源（P0-P5）；排序：时效优先，同天按P0→P5

on:
  # 每小时整点运行（北京时间 = UTC+8，覆盖全天24小时）
  schedule:
    - cron: "0 * * * *"   # 每小时 UTC :00 触发，即北京时间每小时整点
  # push main 时自动部署（代码/配置变更立刻生效，data/ 变更由 Actions 自身处理，忽略避免循环）
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'        # Actions 自动 push data 时不再触发，避免死循环
      - 'logs/**'
  # 允许手动触发，可指定日期
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期（YYYY-MM-DD），留空则使用今天"
        required: false
        default: ""
      force_refresh:
        description: "强制刷新（忽略缓存）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 允许 Actions 写入仓库
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一个实例运行，避免并发写冲突
concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 检出仓库（完整历史，push 时不会 non-fast-forward）──────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 PAT 或默认 GITHUB_TOKEN，确保有写权限
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. 设置 Python ───────────────────────────────────────────
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 安装依赖 ──────────────────────────────────────────────
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml pyyaml python-dateutil

      # ── 4. 确定目标日期 & 小时 ───────────────────────────────────
      - name: 确定日期和时间
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          fi
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          DATETIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          echo "date=$DATE"         >> $GITHUB_OUTPUT
          echo "hour=$HOUR"         >> $GITHUB_OUTPUT
          echo "datetime=$DATETIME" >> $GITHUB_OUTPUT
          echo "当前北京时间: $DATETIME"

      # ── 5a. RSS 源可用性测试（可选，失败不阻断流程）────────────
      - name: 测试 RSS 源可用性
        run: python scripts/_test_rss.py || true

      # ── 5b. 运行新闻抓取 ─────────────────────────────────────────
      - name: 运行新闻抓取
        run: |
          DATE="${{ steps.date.outputs.date }}"
          mkdir -p trendradar/output/news
          python scripts/fetch_news_v3.py \
            --date "$DATE" \
            --output "trendradar/output/news/${DATE}.json" \
            --config "trendradar-config/config.yaml" \
            --words  "trendradar-config/frequency_words.txt"
          echo "抓取完成，检查输出："
          ls -la trendradar/output/news/ || true
          if [ -f "trendradar/output/news/${DATE}.json" ]; then
            python3 -c "
          import json
          with open('trendradar/output/news/$DATE.json') as f:
              d = json.load(f)
          print(f'总计: {d.get(\"total\", 0)} 条')
          print(f'分类: {d.get(\"by_category\", {})}')
          "
          fi

      # ── 6. 转换数据格式（累积追加模式）──────────────────────────
      - name: 转换数据为网站格式
        run: |
          DATE="${{ steps.date.outputs.date }}"
          NEWS_FILE="trendradar/output/news/${DATE}.json"
          OUTPUT_FILE="data/${DATE}.json"

          if [ ! -f "$NEWS_FILE" ]; then
            echo "WARNING: 新闻文件不存在: $NEWS_FILE，尝试查找最新输出..."
            LATEST=$(ls trendradar/output/news/*.json 2>/dev/null | sort | tail -1)
            if [ -n "$LATEST" ]; then
              echo "使用最新文件: $LATEST"
              NEWS_FILE="$LATEST"
            else
              echo "ERROR: 没有找到任何新闻文件，跳过转换"
              exit 0
            fi
          fi

          mkdir -p data

          # ★ 累积追加：若已有数据文件，传入 --existing 合并去重，新旧文章都保留
          if [ -f "$OUTPUT_FILE" ]; then
            echo "已有数据文件: $OUTPUT_FILE，执行累积追加合并"
            python scripts/transform.py \
              --input "$NEWS_FILE" \
              --output "$OUTPUT_FILE" \
              --existing "$OUTPUT_FILE"
          else
            echo "首次生成: $OUTPUT_FILE"
            python scripts/transform.py \
              --input "$NEWS_FILE" \
              --output "$OUTPUT_FILE"
          fi
          echo "数据文件已生成: $OUTPUT_FILE"

      # ── 7. 生成 latest.json 指针（含小时信息）────────────────────
      - name: 更新 latest.json
        run: |
          DATE="${{ steps.date.outputs.date }}"
          HOUR="${{ steps.date.outputs.hour }}"
          DATETIME="${{ steps.date.outputs.datetime }}"
          DATA_FILE="data/${DATE}.json"
          if [ -f "$DATA_FILE" ]; then
            TOTAL=$(python3 -c "
          import json
          with open('$DATA_FILE') as f:
              d = json.load(f)
          articles = d.get('articles', [])
          cats = {}
          for a in articles:
              c = a.get('category', 'unknown')
              cats[c] = cats.get(c, 0) + 1
          print(json.dumps({'total': len(articles), 'by_category': cats}))
          " 2>/dev/null || echo '{"total":0,"by_category":{}}')
            echo "{
              \"date\": \"${DATE}\",
              \"hour\": \"${HOUR}\",
              \"updated_at\": \"${DATETIME}\",
              \"file\": \"data/${DATE}.json\",
              \"stats\": ${TOTAL}
            }" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False, indent=2))" > data/latest.json
            echo "latest.json 已更新 -> ${DATETIME}"
            cat data/latest.json
          else
            echo "WARNING: 数据文件不存在，跳过 latest.json 更新"
          fi

      # ── 8. 永久保留所有历史数据（长期网站，不删除旧文件）────────
      - name: 列出当前数据文件
        run: |
          echo "当前 data/ 文件列表（全部保留）："
          ls -lh data/*.json 2>/dev/null | sort || echo "暂无数据文件"
          echo "共 $(ls data/*.json 2>/dev/null | wc -l) 个数据文件"

      # ── 9. 提交数据文件（带自动重试，彻底解决 non-fast-forward）──
      - name: 提交数据到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "data: ${{ steps.date.outputs.datetime }} 自动更新"

            # ★ 核心修复：push 前先 pull --rebase origin main（正确分支名）
            # 最多重试 3 次，彻底解决并发写导致的 non-fast-forward
            MAX_RETRY=3
            for i in $(seq 1 $MAX_RETRY); do
              echo "第 ${i} 次尝试 push..."
              git pull --rebase origin main
              if git push origin main; then
                echo "push 成功！"
                break
              else
                echo "push 失败，等待 ${i}0 秒后重试..."
                sleep $((i * 10))
                if [ "$i" = "$MAX_RETRY" ]; then
                  echo "::error::push 失败，已重试 ${MAX_RETRY} 次，请检查仓库状态"
                  # ★ 写入错误日志到仓库，方便排查
                  mkdir -p logs
                  echo "${{ steps.date.outputs.datetime }} push失败(重试${MAX_RETRY}次)" >> logs/push_errors.log
                  git add logs/push_errors.log
                  git commit -m "log: push 失败记录 ${{ steps.date.outputs.datetime }}" || true
                  git push origin main --force-with-lease || true
                  exit 1
                fi
              fi
            done
          fi

      # ── 10. 拉取最新 main（确保 step9 push 的 data/ 被纳入部署）──
      - name: 拉取最新代码（含刚提交的数据）
        run: |
          git pull origin main --rebase
          echo "当前 data/ 最新文件："
          ls -lh data/*.json 2>/dev/null | sort -k6,7 | tail -5 || echo "暂无数据文件"

      # ── 11. 部署到 GitHub Pages ──────────────────────────────────
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: ".github,trendradar,trendradar-config,scripts/__pycache__,logs"
          commit_message: "deploy: ${{ steps.date.outputs.datetime }}"
