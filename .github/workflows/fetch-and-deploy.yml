name: 抓取新闻 & 部署 GitHub Pages

# 数据来源方案：学城文档 2763869388
# 三管道：RSS订阅(P0-P5媒体) / 搜索引擎关键词 / 热榜平台
# 四分类：骑手新闻 / 行业动态 / 平台动作 / 舆情信息
# 去重：同一事件保留最高优先级来源；排序：时效优先，同天按P0→P5

on:
  # 每小时整点运行（北京时间 = UTC+8，覆盖全天24小时）
  schedule:
    - cron: "0 * * * *"   # 每小时 UTC :00 触发，即北京时间每小时整点
  # 允许手动触发，可指定日期
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期（YYYY-MM-DD），留空则使用今天"
        required: false
        default: ""
      force_refresh:
        description: "强制刷新（忽略缓存）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 允许 Actions 写入仓库（用于 gh-pages 部署）
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一个实例运行，避免并发写冲突
concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 检出仓库 ──────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 设置 Python ───────────────────────────────────────────
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 安装依赖 ──────────────────────────────────────────────
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml pyyaml python-dateutil

      # ── 4. 确定目标日期 & 小时 ───────────────────────────────────
      - name: 确定日期和时间
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          fi
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          DATETIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")
          echo "date=$DATE"         >> $GITHUB_OUTPUT
          echo "hour=$HOUR"         >> $GITHUB_OUTPUT
          echo "datetime=$DATETIME" >> $GITHUB_OUTPUT
          echo "当前北京时间: $DATETIME"

      # ── 5a. RSS 源可用性测试（可选，失败不阻断流程）────────────
      - name: 测试 RSS 源可用性
        run: python scripts/_test_rss.py || true

      # ── 5b. 运行独立抓取脚本（不依赖 TrendRadar）───────────────
      # fetch_news_v3.py 直接读取 trendradar-config/config.yaml
      # 三管道：RSS(P0-P5媒体) + 搜索引擎关键词 + 热榜平台
      - name: 运行新闻抓取
        run: |
          DATE="${{ steps.date.outputs.date }}"
          mkdir -p trendradar/output/news
          python scripts/fetch_news_v3.py \
            --date "$DATE" \
            --output "trendradar/output/news/${DATE}.json" \
            --config "trendradar-config/config.yaml" \
            --words  "trendradar-config/frequency_words.txt"
          echo "抓取完成，检查输出："
          ls -la trendradar/output/news/ || true
          if [ -f "trendradar/output/news/${DATE}.json" ]; then
            python3 -c "
          import json
          with open('trendradar/output/news/$DATE.json') as f:
              d = json.load(f)
          print(f'总计: {d.get(\"total\", 0)} 条')
          print(f'分类: {d.get(\"by_category\", {})}')
          "
          fi

      # ── 6. 转换数据格式 ──────────────────────────────────────────
      # transform.py 负责：
      #   - 四分类打标（rider/industry/platform/opinion）
      #   - 子分类打标（rider.positive/industry.policy 等22个子分类）
      #   - 去重（标题相似度）
      #   - 排序（时效优先，同天按P0→P5）
      #   - 生成 featured/articles/flash/hot 四个数据块
      - name: 转换数据为网站格式
        run: |
          DATE="${{ steps.date.outputs.date }}"
          NEWS_FILE="trendradar/output/news/${DATE}.json"
          OUTPUT_FILE="data/${DATE}.json"

          if [ ! -f "$NEWS_FILE" ]; then
            echo "WARNING: 新闻文件不存在: $NEWS_FILE，尝试查找最新输出..."
            LATEST=$(ls trendradar/output/news/*.json 2>/dev/null | sort | tail -1)
            if [ -n "$LATEST" ]; then
              echo "使用最新文件: $LATEST"
              NEWS_FILE="$LATEST"
            else
              echo "ERROR: 没有找到任何新闻文件，跳过转换"
              exit 0
            fi
          fi

          mkdir -p data
          python scripts/transform.py --input "$NEWS_FILE" --output "$OUTPUT_FILE"
          echo "数据文件已生成: $OUTPUT_FILE"

      # ── 7. 生成 latest.json 指针（含小时信息）────────────────────
      - name: 更新 latest.json
        run: |
          DATE="${{ steps.date.outputs.date }}"
          HOUR="${{ steps.date.outputs.hour }}"
          DATETIME="${{ steps.date.outputs.datetime }}"
          DATA_FILE="data/${DATE}.json"
          if [ -f "$DATA_FILE" ]; then
            # 统计各分类文章数
            TOTAL=$(python3 -c "
          import json
          with open('$DATA_FILE') as f:
              d = json.load(f)
          articles = d.get('articles', [])
          cats = {}
          for a in articles:
              c = a.get('category', 'unknown')
              cats[c] = cats.get(c, 0) + 1
          print(json.dumps({'total': len(articles), 'by_category': cats}))
          " 2>/dev/null || echo '{"total":0,"by_category":{}}')
            echo "{
              \"date\": \"${DATE}\",
              \"hour\": \"${HOUR}\",
              \"updated_at\": \"${DATETIME}\",
              \"file\": \"data/${DATE}.json\",
              \"stats\": ${TOTAL}
            }" | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin), ensure_ascii=False, indent=2))" > data/latest.json
            echo "latest.json 已更新 -> ${DATETIME}"
            cat data/latest.json
          else
            echo "WARNING: 数据文件不存在，跳过 latest.json 更新"
          fi

      # ── 8. 清理7天前的旧数据 ────────────────────────────────────
      - name: 清理旧数据
        run: |
          find data/ -name "*.json" -not -name "latest.json" -not -name "sample.json" \
            -mtime +7 -delete 2>/dev/null || true
          echo "旧数据清理完成，当前 data/ 文件列表："
          ls -la data/ | head -20

      # ── 9. 提交数据文件 ─────────────────────────────────────────
      - name: 提交数据到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "data: ${{ steps.date.outputs.datetime }} 自动更新"
            git pull --rebase origin master
            git push
          fi

      # ── 10. 部署到 GitHub Pages ──────────────────────────────────
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: ".github,trendradar,trendradar-config,scripts/__pycache__"
          commit_message: "deploy: ${{ steps.date.outputs.datetime }}"

